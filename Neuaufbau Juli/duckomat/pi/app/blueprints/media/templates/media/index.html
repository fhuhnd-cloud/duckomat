{% extends "base.html" %}
{% block title %}Duckomat - Media{% endblock %}

{% block content %}
<div class="media-page-wrapper">
  <div class="video-container">
    <video id="bgVideo" autoplay loop muted playsinline preload="auto">
      <source src="{{ url_for('static', filename='videos/GSD_V1.mp4') }}" type="video/mp4">
      Dein Browser unterstützt das Video-Tag leider nicht.
    </video>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const vid = document.getElementById('bgVideo');
    if (vid) {
      vid.muted = true;
      const playPromise = vid.play();
      if (playPromise !== undefined) {
        playPromise.catch(err => {
          console.warn("Autoplay blockiert, versuche erneut stumm:", err);
          vid.muted = true;
          vid.play();
        });
      }
    }
  });
</script>
{% endblock %}
